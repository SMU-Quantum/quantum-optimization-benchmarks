version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /
      - /research_benchmark
      - /quantum-optimization-algorithms
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Singapore
    # Published paper companion: preserve tested scientific versions. GitHub
    # still opens security PRs when this version-update limit is zero.
    open-pull-requests-limit: 0
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
